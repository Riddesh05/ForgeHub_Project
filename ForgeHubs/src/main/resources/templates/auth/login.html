<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>ForgeHubs | Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container-fluid min-vh-100">

    <div class="row min-vh-100 align-items-center justify-content-center $blue-700">

        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div
                                class="bg-primary text-white rounded-3 d-inline-flex
                                align-items-center justify-content-center
                                fw-bold fs-4 mb-3"
                                style="width: 50px; height: 50px;">

                            F

                        </div>

                        <h2 class="fw-bold mb-2">
                            Welcome back
                        </h2>

                        <p class="text-secondary mb-0">
                            Sign in to continue to ForgeHubs
                        </p>

                    </div>

                    <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                    </div>

                    <div class="mb-3">

                        <label
                                for="email"
                                class="form-label fw-semibold">

                            Email address

                        </label>

                        <input
                                type="email"
                                id="email"
                                class="form-control form-control-lg"
                                placeholder="you@example.com"
                                autocomplete="email">

                    </div>

                    <div class="mb-4">

                        <label
                                for="password"
                                class="form-label fw-semibold">

                            Password

                        </label>

                        <input
                                type="password"
                                id="password"
                                class="form-control form-control-lg"
                                placeholder="Enter your password"
                                autocomplete="current-password">

                    </div>

                    <button
                            type="button"
                            id="loginButton"
                            class="btn btn-primary btn-lg w-100"
                            onclick="login()">

                        <span id="loginText">

                            Sign in
                        </span>

                        <span
                                id="loginSpinner"
                                class="spinner-border spinner-border-sm d-none"
                                role="status">
                        </span>

                    </button>

                </div>

            </div>

            <p class="text-center text-secondary mt-3 small">
                Secure access to your ForgeHubs workspace
            </p>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
        th:src="@{/js/auth/login.js}">
</script>

</body>

</html>
