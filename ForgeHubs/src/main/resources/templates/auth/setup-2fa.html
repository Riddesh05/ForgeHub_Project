<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>ForgeHubs | Setup 2FA</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container-fluid min-vh-100">

    <div class="row min-vh-100 align-items-center justify-content-center">

        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div
                                class="bg-primary text-white rounded-3 d-inline-flex
                                align-items-center justify-content-center
                                fw-bold fs-4 mb-3"
                                style="width: 50px; height: 50px;">

                            F

                        </div>

                        <h2 class="fw-bold mb-2">
                            Set up authentication
                        </h2>

                        <p class="text-secondary mb-0">
                            Secure your ForgeHubs account with two-factor authentication.
                        </p>

                    </div>

                    <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                            role="alert">
                    </div>

                    <div
                            id="successMessage"
                            class="alert alert-success d-none"
                            role="alert">
                    </div>

                    <div class="text-center">

                        <p class="fw-semibold mb-3">
                            1. Scan this QR code
                        </p>

                        <div class="border rounded-3 p-3 d-inline-block mb-4">

                            <img
                                    id="qrCode"
                                    src=""
                                    alt="2FA QR Code"
                                    width="250"
                                    height="250">

                        </div>

                        <p class="text-secondary small mb-4">

                            Open Google Authenticator on your phone
                            and scan the QR code.

                        </p>

                    </div>

                    <div class="mb-3">

                        <label
                                for="otp"
                                class="form-label fw-semibold">

                            2. Enter the 6-digit code

                        </label>

                        <input
                                type="text"
                                id="otp"
                                class="form-control form-control-lg text-center"
                                placeholder="000000"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="one-time-code">

                    </div>

                    <button
                            type="button"
                            id="verifyButton"
                            class="btn btn-primary btn-lg w-100"
                            onclick="verifySetup()">

                        <span id="verifyText">
                            Verify and continue
                        </span>

                        <span
                                id="verifySpinner"
                                class="spinner-border spinner-border-sm d-none"
                                role="status">
                        </span>

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
        th:src="@{/js/auth/setup-2fa.js}">
</script>

</body>

</html>
