<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>ForgeHubs | Recover Authentication</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container-fluid min-vh-100">

    <div class="row min-vh-100 align-items-center justify-content-center">

        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-lg rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div
                                class="bg-primary text-white rounded-3 d-inline-flex
                                align-items-center justify-content-center
                                fw-bold fs-4 mb-3"
                                style="width: 50px; height: 50px;">

                            F

                        </div>

                        <h2 class="fw-bold mb-2">
                            Recover authentication
                        </h2>

                        <p class="text-secondary mb-0">
                            We've sent a verification code to your
                            registered email address.
                        </p>

                    </div>

                    <div
                            id="message"
                            class="alert d-none"
                            role="alert">
                    </div>

                    <div class="mb-4">

                        <label
                                for="emailOtp"
                                class="form-label fw-semibold">

                            Email verification code

                        </label>

                        <input
                                type="text"
                                id="emailOtp"
                                class="form-control form-control-lg text-center"
                                placeholder="000000"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="one-time-code">

                        <div class="form-text text-center mt-2">
                            Enter the 6-digit code sent to your email.
                        </div>

                    </div>

                    <button
                            type="button"
                            id="verifyEmailButton"
                            class="btn btn-primary btn-lg w-100"
                            onclick="verifyEmailOtp()">

                        <span id="verifyEmailText">
                            Verify email
                        </span>

                        <span
                                id="verifyEmailSpinner"
                                class="spinner-border spinner-border-sm d-none"
                                role="status">
                        </span>

                    </button>

                    <div class="text-center mt-4">

                        <a
                                href="/verify-2fa"
                                class="text-decoration-none">

                            Back to authenticator

                        </a>

                    </div>

                </div>

            </div>

            <p class="text-center text-secondary mt-3 small">
                Secure ForgeHubs account recovery
            </p>

        </div>

    </div>

</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
        th:src="@{/js/auth/recover-2fa.js}">
</script>

</body>

</html>
